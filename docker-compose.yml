# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mastera
      POSTGRES_USER: mastera
      POSTGRES_PASSWORD: mastera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastera -d mastera"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for salon and master photos (Apache-2.0).
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -s3 -dir=/data -master.volumeSizeLimitMB=256"
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
    volumes:
      - seaweed:/data

  # Catches all outgoing email in development (MIT).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox

volumes:
  pgdata:
  seaweed:
